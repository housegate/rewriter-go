name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  # Fast lane: pure-Go build/vet/test. Engine-backed tests skip themselves when
  # POLYGLOT_SQL_FFI_PATH is unset, so this runs the comparator, corpus,
  # fidelity-metric and contract tests without the (slow) Rust FFI build.
  unit:
    name: ordinary pure-Go checks
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # go.mod replaces the polyglot Go bindings with the submodule checkout,
      # so even the pure-Go lane needs submodules.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build ./...
      - run: go vet ./...
      - run: env SNAPSHOT_QUERY_ORDINARY=1 go test ./...

  # Ordinary FFI lane: engine regressions + fidelity spike; not snapshot qualification.
  # Final paired snapshot qualification belongs to the private rewriter-grpc lane.
  #
  # Runs on the org's self-hosted runners: the Rust FFI build took ~16 minutes
  # per run on GitHub-hosted runners. The job runs inside the official Rust
  # image so it does not depend on the host's toolchain (the runners differ:
  # one has no C linker). The built library is kept in a per-host named
  # Docker volume, keyed by the pinned polyglot submodule commit, so a run
  # whose submodule is unchanged skips cargo entirely; a bump rebuilds
  # incrementally in a persistent CARGO_TARGET_DIR on the same volume.
  ffi:
    name: ordinary FFI and fidelity checks
    # Self-hosted runners must never execute code from forked PRs: a
    # malicious fork could exfiltrate cached credentials, poison the shared
    # FFI cache, or pivot into the runner's network. Skip the job when the
    # PR's head repo is not this repo. `push` events on main are unaffected.
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'closed') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    container:
      image: rust:1-bookworm
      volumes:
        - rewriter-go-ci-cache:/cache
    # Container jobs default to `sh`; the steps use bash features.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The workspace is owned by the runner user, not the container's root;
      # checkout only trusts it inside its own temporary git config.
      - name: trust the workspace for later git commands
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build or reuse the polyglot FFI library
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD:third_party/polyglot-src)"
          root="/cache/ffi"
          lib="$root/$sha/libpolyglot_sql_ffi.so"
          if [ -f "$lib" ]; then
            echo "FFI library cache hit for polyglot $sha"
          else
            echo "FFI library cache miss for polyglot $sha; building"
            export CARGO_TARGET_DIR="$root/target"
            export CARGO_HOME="/cache/cargo-home"
            (cd third_party/polyglot-src && cargo build -p polyglot-sql-ffi --profile ffi_release)
            mkdir -p "$root/$sha"
            tmp="$(mktemp "$root/$sha/.lib.XXXXXX")"
            cp "$CARGO_TARGET_DIR/ffi_release/libpolyglot_sql_ffi.so" "$tmp"
            mv -f "$tmp" "$lib"
          fi
          mkdir -p third_party/lib
          cp "$lib" third_party/lib/libpolyglot_sql_ffi.so
      - run: make test-ordinary
      # Spec J D7: no test may rewrite a tracked file. characterize_test.go
      # used to overwrite internal/engine/testdata/ast-shapes/*.json on every
      # run and assert nothing, so fixture drift was invisible. It now compares
      # and regenerates only under UPDATE_GOLDEN=1; this step is what keeps it
      # honest. --ignore-submodules=all so a cargo build inside
      # third_party/polyglot-src cannot trip it.
      - name: assert tests did not mutate tracked files
        run: git diff --exit-code --ignore-submodules=all
      - name: fidelity spike
        run: POLYGLOT_SQL_FFI_PATH="$PWD/third_party/lib/libpolyglot_sql_ffi.so" go run ./cmd/fidelity-spike

  # update-polyglot.yml owns both of these PR markers. Requiring both keeps a
  # similarly titled human-authored PR from cutting a release after merge.
  release-polyglot-bump:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'bot/polyglot-') &&
      startsWith(github.event.pull_request.title, 'build: bump polyglot submodule to ')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cut release for merged polyglot bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref main
